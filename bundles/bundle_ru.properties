block.flying-bases-ship-control.name = Управление кораблём
block.flying-bases-ship-control.description = Говорит машине, что привезти. Выберите руду или жидкость (только те, что есть на карте): верх блока окрасится в её цвет. Если такого ресурса у машины нет, она летит к ближайшей жиле или водоёму на карте, касается его буром или помпой и стоит там, пока не наберёт заданную долю максимума (по умолчанию 85%; в хранилищах и баках). Потом, если у машины нет своего ядра, она летит к ближайшему ядру, выгружает туда все предметы из хранилищ (жидкости переливаются в ближайший свободный бак) и отправляется за следующей партией. Ставится только в режиме конструктора машины; на одной машине их может быть несколько.
