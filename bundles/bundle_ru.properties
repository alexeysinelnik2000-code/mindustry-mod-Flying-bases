mb.hud.build = Режим машины. Поставленные блоки входят в машину; блоки без крепления к корпусу подсвечены красным и будут удалены при выходе. Y переносит блок под курсором между мировым слоем (синий) и машинным; зажмите Y и протяните квадрат, чтобы перенести все блоки в нём (начали с блока мира — они присоединяются к машине, с блока машины — уходят из неё). Зелёная стрелка на ядре / хранилище — перёд машины: R поворачивает её (Shift+R — в другую сторону). Буры, помпы, термогенераторы и другие блоки, привязанные к местности, здесь можно ставить где угодно. На сенсорном экране перёд поворачивают две стрелки рядом с надписью «Перёд» в панели.
