block.flying-bases-rocket-booster.name = Ракетный ускоритель
block.flying-bases-rocket-booster.description = Базовый двигатель машины. Ставится только в режиме конструктора машины. Тяга = 1. Скорость машины равна суммарной тяге всех ускорителей, умноженной на мощность одного ракетного ускорителя и делённой на число клеток, которые занимает машина.
block.flying-bases-energy-booster.name = Энергетический ускоритель
block.flying-bases-energy-booster.description = Двигатель 2×2 с тягой как у 4 ракетных ускорителей. Потребляет 90 ед. энергии в секунду, пока машина едет; при нехватке энергии тяга падает. Жидкостный бонус (по желанию): вода удваивает тягу (x2 = 8 ракетных ускорителей), криоген даёт x2,5 (10); расход — 10 ед. жидкости за 5 секунд работы. Ставится только в режиме конструктора машины.
block.flying-bases-fuel-booster.name = Топливный ускоритель
block.flying-bases-fuel-booster.description = Двигатель 3×3, сжигает 1 предмет за 8 секунд работы. Уголь даёт тягу как у 10 ракетных ускорителей, споры — как у 11, пиротит — как у 13,3. Жидкостный бонус (по желанию): вода даёт x1,25, криоген x3 (прежняя тяга: 30 / 33 / 40); на 1 сожжённый предмет уходит 60 ед. жидкости. Топливо подаётся конвейером или выгрузчиком, забрать его из двигателя тоже можно выгрузчиком; без топлива двигатель не работает. Ставится только в режиме конструктора машины.
block.flying-bases-reactor-booster.name = Реакторный ускоритель
block.flying-bases-reactor-booster.description = Сжигает торий ради огромной тяги (×48 ракетных ускорителей). Требует постоянной подачи криогена: иначе перегрев и детонация. Один из самых сильных двигателей — и самых опасных. Взрывается при перегреве и при разрушении.
