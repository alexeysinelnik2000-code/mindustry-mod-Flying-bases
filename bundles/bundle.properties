block.flying-bases-ship-control.name = Ship Control
block.flying-bases-ship-control.description = Tells the machine what to bring home. Set it to an ore or a liquid (only the ones the map has): the top takes the colour of the chosen one. A machine that holds none of it flies to the nearest vein or water body on the map, touches it with its drill or pump and stays there until it holds the set share of its maximum (85% by default; storages and tanks). Then, if it has no core of its own, it flies to the nearest core and unloads every item from its storages there (liquids are poured into the nearest free tank), and goes for the next load. Placeable only in the machine build mode; several can sit on one machine.
