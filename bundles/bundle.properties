block.flying-bases-rocket-booster.name = Rocket Booster
block.flying-bases-rocket-booster.description = The basic engine of a machine. Only placeable in the machine build mode. Thrust = 1. The machine speed is the total thrust of all boosters times the power of one rocket booster, divided by the number of tiles the machine occupies.
block.flying-bases-energy-booster.name = Energy Booster
block.flying-bases-energy-booster.description = A 2x2 engine with the thrust of 4 rocket boosters. Uses 90 power units per second while the machine is driven; with a lack of power the thrust drops. Liquid boost (optional): water doubles the thrust (x2 = 8 rocket boosters), cryofluid gives x2.5 (10); it uses 10 liquid units per 5 seconds of work. Only placeable in the machine build mode.
block.flying-bases-fuel-booster.name = Fuel Booster
block.flying-bases-fuel-booster.description = A 3x3 engine that burns one item per 8 seconds of work. Coal gives the thrust of 10 rocket boosters, spore pods 11, pyratite 13.3. Liquid boost (optional): water gives x1.25, cryofluid x3 (the old thrust: 30 / 33 / 40); 60 liquid units are used per burnt item. Feed it with conveyors or unloaders, fuel can be taken out with an unloader too; without fuel it does not work. Only placeable in the machine build mode.
block.flying-bases-reactor-booster.name = Reactor Booster
block.flying-bases-reactor-booster.description = Burns thorium for huge thrust (48 rocket boosters). Needs a steady cryofluid supply: without cooling it overheats and detonates. One of the strongest engines — and the most dangerous. Explodes on overheat and when destroyed.
