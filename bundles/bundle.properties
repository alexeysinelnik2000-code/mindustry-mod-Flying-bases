mb.hud.build = Machine build mode. Blocks you place join the machine; blocks not attached to the hull are marked red and removed on exit. Y moves the block under the cursor between the world layer (blue) and the machine layer; hold Y and drag a square to move all the blocks in it (start on a world block: they join the machine, start on a machine block: they leave it). The green arrow on a core / storage is the front of the machine: R turns it (Shift+R the other way). Drills, pumps, thermal generators and other blocks tied to the ground can be placed anywhere here. On a touch screen, the two arrows next to "Front" in the panel turn the front.
